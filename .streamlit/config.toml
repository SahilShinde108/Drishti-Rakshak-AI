# Clinical light theme for Drishti-Rakshak AI
# Navy/blue medical palette, Inter font, clean borders

[theme]
base = "light"
primaryColor = "#0969da"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"
borderColor = "#d0d7de"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "17px", "14px", "12px"]
headingFontWeights = [600, 600, 500, 500, 500, 500]
linkUnderline = false

greenColor = "#1a7f37"
redColor = "#cf222e"
orangeColor = "#bf8700"
blueColor = "#0969da"
violetColor = "#8250df"
grayColor = "#57606a"

chartCategoricalColors = ["#0969da", "#1a7f37", "#cf222e", "#bf8700", "#8250df", "#57606a"]
chartSequentialColors = ["#f0f6fc", "#c8e1ff", "#79c0ff", "#58a6ff", "#388bfd", "#1f6feb", "#1158c7", "#0d419d", "#0a3069", "#04244a"]

dataframeBorderColor = "#d0d7de"
dataframeHeaderBackgroundColor = "#f6f8fa"

[theme.sidebar]
backgroundColor = "#f6f8fa"
secondaryBackgroundColor = "#eaeef2"
borderColor = "#d0d7de"
